  function a64(u) { var s = ''; u.forEach(function (x) { s += String.fromCharCode(x); }); return btoa(s); }

  async function desenvolver(clave) {

      } catch (err) {

        boton.disabled = false; boton.textContent = 'Entrar';
        document.getElementById('clave').select();
      }
    });
  })();
</script>
