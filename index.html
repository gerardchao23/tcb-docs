      try {
        await abrir(await desenvolver(document.getElementById('clave').value));
      } catch (err) {
        aviso.textContent = 'Contraseña incorrecta';
        boton.disabled = false; boton.textContent = 'Entrar';
        document.getElementById('clave').select();
      }
    });
  })();
</script>
